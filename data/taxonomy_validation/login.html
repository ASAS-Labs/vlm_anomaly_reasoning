<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taxonomy validation: sign in</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font: 15px system-ui, sans-serif; background: #f6f6f3; color: #1a1a1a; }
  form { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 28px 32px; width: 320px; }
  h1 { font-size: 17px; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: #555; font-size: 13px; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 15px; border: 1px solid #bbb; border-radius: 6px; }
  button { margin-top: 12px; width: 100%; padding: 10px; font-size: 15px; border: 0; border-radius: 6px;
           background: #155e8d; color: #fff; cursor: pointer; }
  .err { color: #b3392e; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Semantic-anomaly taxonomy validation</h1>
  <p>Enter the shared password to continue.</p>
  <input type="password" name="password" placeholder="Password" autofocus required>
  <button type="submit">Enter</button>
  <div class="err" id="err">Wrong password.</div>
</form>
<script>
  if (new URLSearchParams(location.search).get('error')) document.getElementById('err').style.display = 'block';
</script>
</body>
</html>
