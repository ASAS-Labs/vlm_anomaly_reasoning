<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#1a1a1a"></path>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#155e8d"></path>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#b45309"></path>
    </marker>
  </defs>
  <rect x="0" y="0" width="1230" height="440" fill="#ffffff"></rect>

  <!-- input: ego video -->
  <rect x="16" y="71" width="244" height="120" rx="6" fill="#ffffff" stroke="#155e8d" stroke-width="1.8"></rect>
  <text x="138" y="101" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Ego video <tspan font-style="italic" font-family="Times New Roman, Times, serif" font-size="19">V</tspan></text>
  <text x="138" y="123" text-anchor="middle" font-size="15.5" fill="#555555">ego-view driving clip</text>
  <line x1="34" y1="158" x2="242" y2="158" stroke="#1a1a1a" stroke-width="1.6"></line>
  <rect x="177" y="154" width="65" height="8" fill="#ecc79b"></rect>
  <rect x="114" y="154" width="63" height="8" fill="#155e8d"></rect>
  <line x1="34" y1="152" x2="34" y2="164" stroke="#1a1a1a" stroke-width="1.4"></line>
  <line x1="177" y1="152" x2="177" y2="164" stroke="#1a1a1a" stroke-width="1.4"></line>
  <line x1="242" y1="152" x2="242" y2="164" stroke="#1a1a1a" stroke-width="1.4"></line>
  <path d="M114 148 V142 H177 V148" stroke="#155e8d" stroke-width="1.2" fill="none"></path>
  <text x="145" y="138" text-anchor="middle" font-size="15" font-style="italic" font-family="Times New Roman, Times, serif" fill="#155e8d">W</text>
  <text x="34" y="179" text-anchor="middle" font-size="14" fill="#555555">0</text>
  <text x="177" y="179" text-anchor="middle" font-size="14" font-style="italic" font-family="Times New Roman, Times, serif" fill="#1a1a1a">t*</text>
  <text x="242" y="179" text-anchor="middle" font-size="14" font-style="italic" font-family="Times New Roman, Times, serif" fill="#555555">T</text>
  <!-- ground-truth note -->
  <text x="138" y="212" text-anchor="middle" font-size="15" font-style="italic" fill="#555555"><tspan font-family="Times New Roman, Times, serif">t*</tspan> annotated from scene evidence;</text>
  <text x="138" y="229" text-anchor="middle" font-size="15" font-style="italic" fill="#555555">(<tspan font-family="Times New Roman, Times, serif">e*</tspan>, <tspan font-family="Times New Roman, Times, serif">t*</tspan>) used for scoring only</text>

  <!-- input: ego action -->
  <rect x="16" y="269" width="244" height="94" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.8"></rect>
  <text x="138" y="298" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Action trajectory <tspan font-style="italic" font-family="Times New Roman, Times, serif" font-size="19">a</tspan></text>
  <text x="138" y="321" text-anchor="middle" font-size="16.5" fill="#1a1a1a">[<tspan font-style="italic" font-family="Times New Roman, Times, serif">v</tspan>, <tspan font-style="italic" font-family="Times New Roman, Times, serif">&#968;</tspan>] via inverse dynamics</text>
  <text x="138" y="343" text-anchor="middle" font-size="15" fill="#555555">10 Hz native, 5 Hz at inference</text>

  <!-- mid: preprocessing -->
  <rect x="292" y="99" width="216" height="64" rx="6" fill="#e8f0f6" stroke="#155e8d" stroke-width="1.3"></rect>
  <text x="400" y="126" text-anchor="middle" font-size="16.5" fill="#1a1a1a">8 fps sampling</text>
  <text x="400" y="149" text-anchor="middle" font-size="16.5" fill="#1a1a1a">upscale to 1248&#215;720</text>

  <!-- mid: narrative -->
  <rect x="292" y="279" width="216" height="64" rx="6" fill="#f8ecdd" stroke="#b45309" stroke-width="1.3"></rect>
  <text x="400" y="306" text-anchor="middle" font-size="16.5" fill="#1a1a1a">narrative <tspan font-style="italic" font-family="Times New Roman, Times, serif">g</tspan>(<tspan font-style="italic" font-family="Times New Roman, Times, serif">a</tspan>)</text>
  <text x="400" y="329" text-anchor="middle" font-size="15" fill="#555555">deterministic English summary</text>

  <!-- VLM container -->
  <rect x="542" y="40" width="496" height="348" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="7 5"></rect>
  <text x="790" y="62" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Qwen3.8-27B</text>
  <text x="790" y="81" text-anchor="middle" font-size="15.5" fill="#555555">one conversation &#183; extended reasoning, 16,384-token budget</text>

  <!-- stage 1 -->
  <rect x="560" y="92" width="460" height="96" rx="6" fill="#ffffff" stroke="#155e8d" stroke-width="1.8"></rect>
  <text x="790" y="119" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#155e8d">Stage 1 (turn 1): expectation generation</text>
  <text x="790" y="144" text-anchor="middle" font-size="17.5" fill="#1a1a1a">action-blind window <tspan font-style="italic" font-family="Times New Roman, Times, serif">W</tspan> = <tspan font-style="italic" font-family="Times New Roman, Times, serif">V</tspan>[max(0, <tspan font-style="italic" font-family="Times New Roman, Times, serif">t*</tspan>&#8722;&#916;), <tspan font-style="italic" font-family="Times New Roman, Times, serif">t*</tspan>]</text>
  <text x="790" y="168" text-anchor="middle" font-size="17.5" fill="#1a1a1a">prompt <tspan font-style="italic" font-family="Times New Roman, Times, serif">P</tspan><tspan font-size="12.5" baseline-shift="sub">exp</tspan> with depiction guard</text>

  <!-- e-hat arrow -->
  <line x1="622" y1="188" x2="622" y2="254" stroke="#155e8d" stroke-width="1.6" marker-end="url(#arrB)"></line>
  <text x="642" y="216" font-size="17" fill="#1a1a1a">expectation <tspan font-style="italic" font-family="Times New Roman, Times, serif">&#234;</tspan> &#8712; {Continue, Slow, Stop, Wait}</text>
  <text x="642" y="237" font-size="15" fill="#555555">with the cited scene feature</text>

  <!-- stage 2 -->
  <rect x="560" y="258" width="460" height="106" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.8"></rect>
  <text x="790" y="286" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#b45309">Stage 2 (turn 2): expectation&#8211;action comparison</text>
  <text x="790" y="311" text-anchor="middle" font-size="17.5" fill="#1a1a1a">prompt <tspan font-style="italic" font-family="Times New Roman, Times, serif">P</tspan><tspan font-size="12.5" baseline-shift="sub">cmp</tspan> states compatibility relation <tspan font-style="italic" font-family="Times New Roman, Times, serif">&#8499;</tspan></text>
  <text x="790" y="336" text-anchor="middle" font-size="17.5" fill="#1a1a1a">observed motion class <tspan font-style="italic" font-family="Times New Roman, Times, serif">c</tspan>(<tspan font-style="italic" font-family="Times New Roman, Times, serif">a</tspan>) checked against <tspan font-style="italic" font-family="Times New Roman, Times, serif">&#8499;</tspan>(<tspan font-style="italic" font-family="Times New Roman, Times, serif">&#234;</tspan>)</text>

  <!-- verdict -->
  <rect x="1068" y="258" width="146" height="106" rx="6" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.6"></rect>
  <text x="1141" y="300" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#1a1a1a">verdict <tspan font-style="italic" font-family="Times New Roman, Times, serif" font-size="19">&#375;</tspan></text>
  <text x="1141" y="330" text-anchor="middle" font-size="16.5" fill="#1a1a1a">Normal / Anomaly</text>
  <text x="1141" y="386" text-anchor="middle" font-size="15" font-style="italic" fill="#555555">from the final</text>
  <text x="1141" y="403" text-anchor="middle" font-size="15" font-style="italic" fill="#555555">&#8220;Classification:&#8221; line</text>

  <!-- flow arrows -->
  <line x1="260" y1="131" x2="288" y2="131" stroke="#155e8d" stroke-width="1.6" marker-end="url(#arrB)"></line>
  <line x1="508" y1="131" x2="539" y2="131" stroke="#155e8d" stroke-width="1.6" marker-end="url(#arrB)"></line>
  <line x1="260" y1="311" x2="288" y2="311" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrA)"></line>
  <line x1="508" y1="311" x2="539" y2="311" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrA)"></line>
  <line x1="1038" y1="311" x2="1064" y2="311" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"></line>

  <!-- deployment note -->
  <text x="590" y="424" text-anchor="middle" font-size="15.5" font-style="italic" fill="#555555">In deployment, <tspan font-family="Times New Roman, Times, serif">W</tspan> is the trailing camera buffer and the trajectory after <tspan font-family="Times New Roman, Times, serif">t*</tspan> is the planner&#39;s published plan, evaluated before execution.</text>
</svg>
